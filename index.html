<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Chord Box Rows</title>
  <style>
    body {
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .cushion-top {
      width: 100vw;
      height: clamp(20px, 6vw, 70px);
      min-height: 20px;
      max-height: 70px;
      flex-shrink: 0;
      pointer-events: none;
      background: transparent;
    }
    .chord-row {
      display: flex;
      gap: 2vw;
      margin-bottom: 5vw;
    }
    .chord-box, .empty-box {
      position: relative;
      width: clamp(64px, 14vw, 200px);
      /* Increased height by 10% */
      height: clamp(66px, 14.3vw, 210px);
      border-radius: clamp(10px, 2vw, 20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(10px, 2vw, 30px) clamp(2px, 0.5vw, 10px) clamp(7px, 1.5vw, 20px);
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      color: white;
      background: transparent;
      transition: width 0.2s, height 0.2s, padding 0.2s;
    }
    .chord-box {
      background: #ccc;
    }
    .chord-a { background-color: #007AFF;}
    .chord-b { background-color: #AF52DE;}
    .chord-e { background-color: #FFCC00;}
    .chord-d { background-color: #FF9500;}
    .chord-g { background-color: #5afaf5;}
    .chord-c { background-color: #FF3B30;}
    .chord-f { background-color: #34C759;}
    .empty-box {
      background: transparent;
      box-shadow: none;
    }
    .top-boxes {
      position: absolute;
      top: calc(-1 * clamp(12px, 2.5vw, 35px));
      display: flex;
      gap: clamp(3px, 0.6vw, 10px);
    }
    .note-box {
      width: clamp(22px, 5vw, 70px);
      height: clamp(22px, 5vw, 70px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: clamp(3px, 1vw, 10px);
      font-size: clamp(18px, 3vw, 52px);
      font-weight: bold;
      color: white;
      transition: font-size 0.2s;
    }
    .note-b { background-color: #AF52DE;}
    .note-d { background-color: #FF9500;}
    .note-g { background-color: #5afaf5;}
    .note-c { background-color: #FF3B30;}
    .note-f { background-color: #34C759;}
    .note-a { background-color: #007AFF;}
    .note-e { background-color: #FFCC00;}
    /* Accidental styling */
    .accidental {
      font-size: 0.5em;
      vertical-align: top;
      position: relative;
      top: -0.4em;
      margin-left: 1px;
      font-weight: normal;
    }
    /* Chord Name with minor 'm' inline and small */
    .chord-name {
      font-size: clamp(42px, 9vw, 130px);
      font-weight: bold;
      margin: 0;
      line-height: 1;
      color: white;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .minor {
      font-size: 0.5em;
      font-weight: normal;
      margin-left: 0.02em;
      display: inline;
      vertical-align: baseline;
      line-height: 1;
      letter-spacing: 0.01em;
    }
    .bottom-section {
      position: absolute;
      bottom: calc(-1 * clamp(13px, 2vw, 38px));
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .chord-position {
      background: transparent;
      color: white;
      width: clamp(44px, 10vw, 140px);
      height: clamp(22px, 5vw, 70px);
      display: flex;
      align-items: center;
      justify-content: center;
      /* Remove border-radius for sharp corners */
      border-radius: 0;
      font-size: clamp(18px, 3vw, 52px);
      font-family: 'Georgia', serif;
      font-weight: bold;
      transition: font-size 0.2s;
      text-shadow: 0 1px 4px rgba(0,0,0,0.15);
      /* Only top border white */
      border-top: 2.5px solid white;
      border-right: none;
      border-bottom: none;
      border-left: none;
      /* Remove background and other borders */
      box-sizing: border-box;
    }
    @media (max-width: 700px) {
      .chord-row {
        gap: 1vw;
      }
      .chord-box, .empty-box {
        width: clamp(44px, 17vw, 120px);
        /* Increased height by 10% */
        height: clamp(44px, 17.6vw, 132px);
        padding: clamp(5px, 1vw, 14px) clamp(1px, 0.4vw, 4px) clamp(4px, 0.8vw, 7px);
      }
      .top-boxes {
        top: calc(-1 * clamp(8px, 2vw, 22px));
      }
      .bottom-section {
        bottom: calc(-1 * clamp(8px, 2vw, 22px));
      }
      .cushion-top {
        height: clamp(10px, 9vw, 40px);
        min-height: 10px;
        max-height: 40px;
      }
    }
    @media (max-width: 480px) {
      .chord-row {
        gap: 0.5vw;
        margin-bottom: 3vw;
      }
      .chord-box, .empty-box {
        width: clamp(32px, 20vw, 84px);
        /* Increased height by 10% */
        height: clamp(30px, 23.1vw, 84px);
        padding: clamp(3px, 1vw, 8px) clamp(0.5px, 0.3vw, 2px) clamp(2px, 0.5vw, 5px);
      }
      .top-boxes {
        top: calc(-1 * clamp(4px, 1vw, 10px));
      }
      .bottom-section {
        bottom: calc(-1 * clamp(4px, 1vw, 10px));
      }
      .cushion-top {
        height: clamp(4px, 7vw, 20px);
        min-height: 4px;
        max-height: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="cushion-top"></div>
  <!-- Row 1: All five chord boxes as before -->
  <div class="chord-row">
    <div class="chord-box chord-a">
      <div class="top-boxes">
        <div class="note-box note-b">B</div>
        <div class="note-box note-d">D</div>
      </div>
      <div class="chord-name">A</div>
      <div class="bottom-section">
        <div class="chord-position">V/V</div>
      </div>
    </div>
    <div class="chord-box chord-d">
      <div class="top-boxes">
        <div class="note-box note-f">
          F<span class="accidental">&#x266F;</span>
        </div>
        <div class="note-box note-a">A</div>
      </div>
      <div class="chord-name">D</div>
      <div class="bottom-section">
        <div class="chord-position">V</div>
      </div>
    </div>
    <div class="chord-box chord-g">
      <div class="top-boxes">
        <div class="note-box note-b">B</div>
        <div class="note-box note-d">D</div>
      </div>
      <div class="chord-name">G</div>
      <div class="bottom-section">
        <div class="chord-position">I</div>
      </div>
    </div>
    <div class="chord-box chord-c">
      <div class="top-boxes">
        <div class="note-box note-e">E</div>
        <div class="note-box note-g">G</div>
      </div>
      <div class="chord-name">C</div>
      <div class="bottom-section">
        <div class="chord-position">IV</div>
      </div>
    </div>
    <div class="chord-box chord-f">
      <div class="top-boxes">
        <div class="note-box note-a">A</div>
        <div class="note-box note-c">C</div>
      </div>
      <div class="chord-name">F</div>
      <div class="bottom-section">
        <div class="chord-position">V/IV</div>
      </div>
    </div>
  </div>
  <!-- Row 2: Only chord boxes in spots 2, 3, 4, empty boxes in 1 and 5 -->
  <div class="chord-row">
    <div class="empty-box"></div>
    <!-- Box 2: Bm, D / F# -->
    <div class="chord-box chord-b">
      <div class="top-boxes">
        <div class="note-box note-d">D</div>
        <div class="note-box note-f">
          F<span class="accidental">&#x266F;</span>
        </div>
      </div>
      <div class="chord-name">B<span class="minor">m</span></div>
      <div class="bottom-section">
        <div class="chord-position">iii</div>
      </div>
    </div>
    <!-- Box 3: Em, G / B -->
    <div class="chord-box chord-e">
      <div class="top-boxes">
        <div class="note-box note-g">G</div>
        <div class="note-box note-b">B</div>
      </div>
      <div class="chord-name">E<span class="minor">m</span></div>
      <div class="bottom-section">
        <div class="chord-position">vi</div>
      </div>
    </div>
    <!-- Box 4: Am, C / E -->
    <div class="chord-box chord-a">
      <div class="top-boxes">
        <div class="note-box note-c">C</div>
        <div class="note-box note-e">E</div>
      </div>
      <div class="chord-name">A<span class="minor">m</span></div>
      <div class="bottom-section">
        <div class="chord-position">ii</div>
      </div>
    </div>
    <div class="empty-box"></div>
  </div>
</body>
</html>
