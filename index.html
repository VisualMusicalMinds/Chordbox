<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Box</title>
  <style>
    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chord-box {
      position: relative;
      width: 200px;
      height: 190px;
      background-color: #00979D; /* teal */
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 10px 20px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      color: white;
    }
    .top-boxes {
      position: absolute;
      top: -35px;
      display: flex;
      gap: 10px;
    }
    .small-box {
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 52px;
      font-weight: bold;
    }
    .purple {
      background-color: purple;
    }
    .orange {
      background-color: orange;
    }
    .big-letter {
      font-size: 130px;
      font-weight: bold;
      margin: 0;
      line-height: 1;
    }
    .bottom-section {
      position: absolute;
      bottom: -38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .roman-numeral-box {
      background: white;
      color: black;
      width: 140px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 52px;
      font-family: 'Georgia', serif;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="chord-box">
    <div class="top-boxes">
      <div class="small-box purple">B</div>
      <div class="small-box orange">D</div>
    </div>
    <div class="big-letter">G</div>
    <div class="bottom-section">
      <div class="roman-numeral-box">I</div>
    </div>
  </div>
</body>
</html>
